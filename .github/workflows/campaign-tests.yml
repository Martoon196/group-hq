name: Group HQ tests

on:
  push:
    branches: [codex/ghq-wa-pairing-20261106, codex/ghq-unified-inbox-20261106, codex/ghq-personal-inbox-release-20261106]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  keyword-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/whatsapp-keywords --ignore-scripts --no-audit --no-fund
      - run: node --test tools/whatsapp-keywords/test.cjs tools/whatsapp-keywords/socket.test.cjs tools/personal-inbox/test.cjs
  postgres-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grouphq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/grouphq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Rehearse migration from the live 0008 head
        run: |
          alembic upgrade 0008_mentee_earnings
          alembic upgrade head
          python -c "from app import migrate; assert migrate.current_revision() == migrate.head_revision() == '0011_unified_inbox'"
      - name: Check inbox transports without provider calls
        run: python -m unittest discover -s unit_checks -p inbox_providers.py -v
      - name: Run exact source suite
        run: pytest -q
