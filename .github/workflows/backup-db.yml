# Weekly off-site backups of several apps' Postgres databases from ONE repository, plus a monthly restore drill.
#
# This copy lives in Group HQ and covers every MH196 2026 Ltd database whose secret is set, so the Cloudflare
# R2 details are entered once. Repository secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL_GROUPHQ   Group HQ's DIRECT (non-pooled) Neon connection string
#   BACKUP_DATABASE_URL_KP        Key Properties' direct Neon string ("kpuk-portal")
#   BACKUP_DATABASE_URL_PP        Property Predator's direct Neon string (optional; skipped until set)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET   the mh196-db-backups bucket and its token
#   BACKUP_AGE_RECIPIENT / BACKUP_AGE_IDENTITY   optional encryption, as in the single-app version
# An app whose database secret is not set is skipped with a notice, never a failure. Hello New Home (a different
# company) keeps its own copy of this job in its own repository.
# Retention is a lifecycle rule on the bucket (delete after 120 days), not this file.
# Client tools are PostgreSQL 18: pg_dump must be at least the server's major version, and Neon offers 14 to 18.

name: Database backup

on:
  schedule:
    - cron: "17 3 * * 1"      # weekly dump, Mondays 03:17 UTC
    - cron: "41 4 1 * *"      # restore drill, 1st of the month 04:41 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "dump or drill"
        default: dump
        type: choice
        options: [dump, drill]

permissions:
  contents: read

concurrency:
  group: database-backup-${{ github.workflow }}
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required     # R2 compatibility with AWS CLI >= 2.23
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  dump:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'dump')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: grouphq, secret: BACKUP_DATABASE_URL_GROUPHQ }
          - { app: kp, secret: BACKUP_DATABASE_URL_KP }
          - { app: pp, secret: BACKUP_DATABASE_URL_PP }
    env:
      APP_NAME: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Is this app configured
        id: cfg
        env:
          DATABASE_URL: ${{ secrets[matrix.secret] }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${APP_NAME}: no ${SECRET_NAME} secret, so this app is skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 18 client tools
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # The runner image ships a PostgreSQL 16 cluster, so Ubuntu's pg_wrapper would pick the 16 tools;
          # put the 18 binaries first on PATH for every later step.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump
        if: steps.cfg.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets[matrix.secret] }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "database secret is not set"; exit 1; }
          stamp="$(date -u +%Y-%m-%d)"
          out="${APP_NAME}-${stamp}.dump"
          pg_dump --version
          pg_dump "$DATABASE_URL" --format=custom --compress=6 --no-owner --no-privileges -f "$out"
          tables="$(pg_restore --list "$out" | grep -c 'TABLE DATA' || true)"
          echo "dump: $(stat -c %s "$out") bytes, ${tables} tables with data"
          test "$tables" -gt 0 || { echo "dump contains no table data"; exit 1; }
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Encrypt when a recipient key is configured
        if: steps.cfg.outputs.skip != 'true'
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          if [ -z "${AGE_RECIPIENT:-}" ]; then echo "no BACKUP_AGE_RECIPIENT; uploading unencrypted"; exit 0; fi
          sudo apt-get install -y -qq age
          age -r "$AGE_RECIPIENT" -o "${OUT}.age" "$OUT"
          rm -f "$OUT"
          echo "OUT=${OUT}.age" >> "$GITHUB_ENV"

      - name: Upload to R2
        if: steps.cfg.outputs.skip != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # Trim stray spaces or line breaks pasted into the secrets, then try the account's standard R2 endpoint and,
          # failing that, the EU-jurisdiction one, so a bucket created either way works with the same secrets.
          R2_BUCKET="$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]')"
          R2_ACCOUNT_ID="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]')"
          r2() {
            local ep kind
            for kind in standard eu; do
              if [ "$kind" = standard ]; then ep="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"; else ep="https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com"; fi
              if "$@" --endpoint-url "$ep" 2>r2-error.txt; then echo "(R2 ${kind} endpoint)" >&2; return 0; fi
              echo "R2 ${kind} endpoint refused: $(tail -n 1 r2-error.txt)" >&2
            done
            return 1
          }
          r2 aws s3 cp "$OUT" "s3://${R2_BUCKET}/${APP_NAME}/${OUT}" --no-progress
          r2 aws s3api head-object --bucket "$R2_BUCKET" --key "${APP_NAME}/${OUT}" --query ContentLength --output text
          rm -f "$OUT"

  drill:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 4 1 * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'drill')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: grouphq, secret: BACKUP_DATABASE_URL_GROUPHQ }
          - { app: kp, secret: BACKUP_DATABASE_URL_KP }
          - { app: pp, secret: BACKUP_DATABASE_URL_PP }
    env:
      APP_NAME: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Is this app configured
        id: cfg
        env:
          DATABASE_URL: ${{ secrets[matrix.secret] }}
          SECRET_NAME: ${{ matrix.secret }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${APP_NAME}: no ${SECRET_NAME} secret, so this app is skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 18 client tools
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Fetch the newest dump
        if: steps.cfg.outputs.skip != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # Trim stray spaces or line breaks pasted into the secrets, then try the account's standard R2 endpoint and,
          # failing that, the EU-jurisdiction one, so a bucket created either way works with the same secrets.
          R2_BUCKET="$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]')"
          R2_ACCOUNT_ID="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '[:space:]')"
          r2() {
            local ep kind
            for kind in standard eu; do
              if [ "$kind" = standard ]; then ep="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"; else ep="https://${R2_ACCOUNT_ID}.eu.r2.cloudflarestorage.com"; fi
              if "$@" --endpoint-url "$ep" 2>r2-error.txt; then echo "(R2 ${kind} endpoint)" >&2; return 0; fi
              echo "R2 ${kind} endpoint refused: $(tail -n 1 r2-error.txt)" >&2
            done
            return 1
          }
          key="$(r2 aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "${APP_NAME}/" \
                 --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)"
          test -n "$key" && test "$key" != "None" || { echo "no dump found under ${APP_NAME}/"; exit 1; }
          echo "restoring $key"
          r2 aws s3 cp "s3://${R2_BUCKET}/${key}" ./latest --no-progress
          echo "KEY=$key" >> "$GITHUB_ENV"

      - name: Decrypt when needed
        if: steps.cfg.outputs.skip != 'true'
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          case "$KEY" in
            *.age)
              test -n "${AGE_IDENTITY:-}" || { echo "dump is encrypted but BACKUP_AGE_IDENTITY is not set; the drill cannot restore it. Run the drill on the office machine instead (see docs)."; exit 1; }
              printf '%s\n' "$AGE_IDENTITY" > identity.txt
              age -d -i identity.txt -o latest.dump latest
              rm -f identity.txt latest ;;
            *) mv latest latest.dump ;;
          esac

      - name: Restore into a scratch server and count rows
        if: steps.cfg.outputs.skip != 'true'
        env:
          PGPASSWORD: drill
        run: |
          set -euo pipefail
          url="postgresql://postgres:drill@localhost:5432/drill"
          pg_restore --no-owner --no-privileges -d "$url" latest.dump
          psql "$url" -v ON_ERROR_STOP=1 -At -c "
            select relname, n_live_tup from pg_stat_user_tables order by n_live_tup desc limit 15;"
          total="$(psql "$url" -At -c "select coalesce(sum(n_live_tup),0) from pg_stat_user_tables;")"
          echo "rows restored (approx): $total"
          test "$total" -gt 0 || { echo "restore produced no rows"; exit 1; }
