services:
  - type: web
    name: group-hq
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    # No --proxy-headers / --forwarded-allow-ips: trusting X-Forwarded-For from any address would let a caller
    # choose the address the login throttle keys on. app.auth.client_ip reads the RIGHT-most X-Forwarded-For
    # entry, the one Render's proxy appended, and the throttle also has a per-account key that no address can
    # reset. Confirm against a staging deploy that Render appends rather than overwrites the header.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://group-hq.onrender.com
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      # Used once, at the first boot, to create the admin; the first login must change it. Clear it from the
      # dashboard after that boot so the working password never lives in the environment.
      - key: ADMIN_PASSWORD
        sync: false
      - key: PP_BASE_URL
        value: https://propertypredator.com
      - key: PP_SERVICE_TOKEN
        sync: false
      - key: ORDRIS_BASE_URL
        value: https://ordris.io
      - key: ORDRIS_PARTNER_TOKEN
        sync: false
      - key: KP_BASE_URL
        value: https://portal.keypropertiesuk.co.uk
      - key: KP_PARTNER_TOKEN
        sync: false
      - key: HNH_BASE_URL
        value: https://hellonewhome.co.uk
      - key: HNH_PARTNER_TOKEN
        sync: false
      # "1" keeps every product in dry run whatever the Settings screen says (the emergency stop for everything).
      # Otherwise each product follows its Live / Dry run switch on the Settings screen once it has been set, and
      # this value is only the default for a product never switched: "0" defaults every product to live, a list
      # defaults those products to dry run. To stop one product, use its Dry run switch on Settings: editing this
      # list does not stop a product whose switch says Live. Ordris, Key Properties and Hello New Home went live on
      # 21 October 2026 (each lookup answered ok with its shared token); Property Predator stays listed until its
      # branch clears the audit lane.
      - key: CONNECTORS_DRY_RUN
        value: "pp"
      # Franchise follow-up emails. With SMTP_HOST unset the emails are shown for copying and nothing is sent.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      - key: MAIL_FROM
        sync: false
      # Bearer token Hello New Home presents to GET /api/territories.json (district, area, state only).
      - key: TERRITORY_EXPORT_TOKEN
        sync: false

  - type: cron
    name: group-hq-recompute
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "10 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.recompute
    # Render can only copy a variable the web service actually holds. PP_SERVICE_TOKEN was set on the web
    # service on 23 Oct 2026 and is copied below; sync the Blueprint before switching PP to Live on the
    # Settings screen. A product that is not in dry run but has no token here is sent nothing at night, and
    # the job then exits 1 so the run shows as failed.
    # Deploy this cron from the same commit as the web service: the job refuses to run (exit 1, nothing sent)
    # when the database is not at its own Alembic head.
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
      - key: PP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_BASE_URL
      - key: PP_SERVICE_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_SERVICE_TOKEN
      - key: ORDRIS_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_BASE_URL
      - key: ORDRIS_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_PARTNER_TOKEN
      - key: KP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_BASE_URL
      - key: KP_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_PARTNER_TOKEN
      - key: HNH_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_BASE_URL
      - key: HNH_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_PARTNER_TOKEN
      - key: CONNECTORS_DRY_RUN
        fromService:
          type: web
          name: group-hq
          envVarKey: CONNECTORS_DRY_RUN

  # Seller self-billing statements: on the 10th it generates the previous month for every seller with payable
  # entries; on any other day it is a no-op (app/jobs/statements.py). Runs after the recompute.
  - type: cron
    name: group-hq-statements
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "40 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.statements
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
