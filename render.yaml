services:
  - type: web
    name: group-hq
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    # No --proxy-headers / --forwarded-allow-ips: trusting X-Forwarded-For from any address would let a caller
    # choose the address the login throttle keys on. app.auth.client_ip reads the RIGHT-most X-Forwarded-For
    # entry, the one Render's proxy appended, and the throttle also has a per-account key that no address can
    # reset. Confirm against a staging deploy that Render appends rather than overwrites the header.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://group-hq.onrender.com
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      # Used once, at the first boot, to create the admin; the first login must change it. Clear it from the
      # dashboard after that boot so the working password never lives in the environment.
      - key: ADMIN_PASSWORD
        sync: false
      - key: PP_BASE_URL
        value: https://propertypredator.com
      - key: PP_SERVICE_TOKEN
        sync: false
      - key: ORDRIS_BASE_URL
        value: https://ordris.io
      - key: ORDRIS_PARTNER_TOKEN
        sync: false
      - key: KP_BASE_URL
        value: https://portal.keypropertiesuk.co.uk
      - key: KP_PARTNER_TOKEN
        sync: false
      - key: HNH_BASE_URL
        value: https://hellonewhome.co.uk
      - key: HNH_PARTNER_TOKEN
        sync: false
      # "1" keeps every product in dry run whatever the Settings screen says (the emergency stop for everything).
      # Otherwise each product follows its Live / Dry run switch on the Settings screen once it has been set, and
      # this value is only the default for a product never switched: "0" defaults every product to live, a list
      # defaults those products to dry run. To stop one product, use its Dry run switch on Settings: editing this
      # list does not stop a product whose switch says Live. Ordris, Key Properties and Hello New Home went live on
      # 21 October 2026 (each lookup answered ok with its shared token); Property Predator stays listed until its
      # branch clears the audit lane.
      - key: CONNECTORS_DRY_RUN
        value: "pp"
      # Franchise follow-up emails. With SMTP_HOST unset the emails are shown for copying and nothing is sent.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      - key: MAIL_FROM
        sync: false
      # Bearer token Hello New Home presents to GET /api/territories.json (district, area, state only).
      - key: TERRITORY_EXPORT_TOKEN
        sync: false
      # Growth (docs/growth.md): read-only credentials for the Growth screens, each set in the dashboard on THIS
      # service when its source is started. None is ever logged or shown; Growth > Sources lists them by name.
      # A growth cron gets a variable only through a fromService entry, and Render can copy only a variable this
      # service already holds: so the entry follows the variable, never the other way round. Set it here first,
      # then add its fromService line to the cron that reads it (the list is above group-hq-growth-hourly below),
      # sync, press Test on Growth > Sources, and only then switch the source On.
      # GOOGLE_SA_JSON is the service-account key file's JSON as one line (an env var, not a secret file, so it can
      # be copied to the crons). The *_PRODUCTS / *_IDS / *_SITES values map a platform's id to a product code.
      # STRIPE_RK_HNH waits for Hello New Home 2 Ltd's Stripe account, ZERNIO_AD_ACCOUNTS for an ad account connected
      # in Zernio: leave both unset (and out of the crons) until then.
      - key: GOOGLE_SA_JSON
        sync: false
      - key: GA4_PROPERTY_IDS
        sync: false
      - key: GSC_SITES
        sync: false
      - key: STRIPE_RK_MH196
        sync: false
      - key: STRIPE_RK_HNH
        sync: false
      - key: STRIPE_PRODUCT_MAP
        sync: false
      - key: BREVO_API_KEY_HQ
        sync: false
      - key: BREVO_LIST_PRODUCTS
        sync: false
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_PROFILE_PRODUCTS
        sync: false
      - key: ZERNIO_AD_ACCOUNTS
        sync: false
      # Neon's ORGANISATION key can change and delete projects: it lives on this service and the daily growth cron
      # only (never the hourly one), and is used only to read the project list and the consumption history.
      # NEON_PROJECT_PRODUCTS labels each project, projectId=label (pp, kp, ordris, hnh, grouphq, or any free text).
      - key: NEON_API_KEY
        sync: false
      - key: NEON_ORG_ID
        sync: false
      - key: NEON_PROJECT_PRODUCTS
        sync: false
      # CLERK_SECRET_KEY_ORDRIS is deliberately absent: Clerk's backend key can delete Ordris users (docs/growth.md).

  - type: cron
    name: group-hq-recompute
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "10 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.recompute
    # Render can only copy a variable the web service actually holds. PP_SERVICE_TOKEN was set on the web
    # service on 23 Oct 2026 and is copied below; sync the Blueprint before switching PP to Live on the
    # Settings screen. A product that is not in dry run but has no token here is sent nothing at night, and
    # the job then exits 1 so the run shows as failed.
    # Deploy this cron from the same commit as the web service: the job refuses to run (exit 1, nothing sent)
    # when the database is not at its own Alembic head.
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
      - key: PP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_BASE_URL
      - key: PP_SERVICE_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_SERVICE_TOKEN
      - key: ORDRIS_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_BASE_URL
      - key: ORDRIS_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_PARTNER_TOKEN
      - key: KP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_BASE_URL
      - key: KP_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_PARTNER_TOKEN
      - key: HNH_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_BASE_URL
      - key: HNH_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_PARTNER_TOKEN
      - key: CONNECTORS_DRY_RUN
        fromService:
          type: web
          name: group-hq
          envVarKey: CONNECTORS_DRY_RUN

  # Seller self-billing statements: on the 10th it generates the previous month for every seller with payable
  # entries; on any other day it is a no-op (app/jobs/statements.py). Runs after the recompute.
  - type: cron
    name: group-hq-statements
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "40 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.statements
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL

  # Growth pulls (app/jobs/growth_pull.py, docs/growth.md). Read-only: nothing is ever sent to a platform. Every source
  # starts Off on Growth > Sources, so both crons ship with only what the web service holds today: the database, the
  # app's settings, the dry-run floor and (hourly) the product base URLs and tokens. A source's own variables are
  # copied here by a fromService entry added once the web service holds them (Render can only copy a variable the
  # web service holds, and an entry naming one it does not hold fails the Blueprint sync), then the source is
  # switched On. A source that is On but missing here makes the run exit 1 (failed on Render), naming the variable.
  # Deploy both crons from the same commit as the web service: the job refuses to run (exit 1, nothing done) when
  # the database is not at its Alembic head.
  #
  # The fromService lines to add, each once its variable is set on the web service:
  #   group-hq-growth-hourly: STRIPE_RK_MH196 and STRIPE_PRODUCT_MAP (stripe_mh196); STRIPE_RK_HNH (stripe_hnh, once
  #     Hello New Home 2 Ltd has a Stripe account); GOOGLE_SA_JSON and GA4_PROPERTY_IDS (ga4's realtime read).
  #   group-hq-growth-daily: GOOGLE_SA_JSON and GA4_PROPERTY_IDS (ga4); GSC_SITES (search_console); BREVO_API_KEY_HQ
  #     and BREVO_LIST_PRODUCTS (brevo); ZERNIO_API_KEY and ZERNIO_PROFILE_PRODUCTS (zernio), ZERNIO_AD_ACCOUNTS once
  #     an ad account is connected in Zernio; NEON_API_KEY, NEON_ORG_ID and NEON_PROJECT_PRODUCTS (neon). The Neon
  #     organisation key goes on the daily cron only, never the hourly one.
  #   Each in the same form as DATABASE_URL below. The non-secret mappings (GA4_PROPERTY_IDS, GSC_SITES, the
  #   *_PRODUCTS lists, STRIPE_PRODUCT_MAP, NEON_ORG_ID) may be plain value: entries instead, once known.
  #   CLERK_SECRET_KEY_ORDRIS is never added (docs/growth.md).
  - type: cron
    name: group-hq-growth-hourly
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "7 * * * *"           # Stripe, the four product ledgers and GA4 realtime users; about 20 calls
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.growth_pull --tier hourly
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
      - key: CONNECTORS_DRY_RUN
        fromService:
          type: web
          name: group-hq
          envVarKey: CONNECTORS_DRY_RUN
      - key: PP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_BASE_URL
      - key: PP_SERVICE_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_SERVICE_TOKEN
      - key: ORDRIS_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_BASE_URL
      - key: ORDRIS_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_PARTNER_TOKEN
      - key: KP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_BASE_URL
      - key: KP_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_PARTNER_TOKEN
      - key: HNH_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_BASE_URL
      - key: HNH_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_PARTNER_TOKEN

  - type: cron
    name: group-hq-growth-daily
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "10 6 * * *"          # 06:10 UTC: GA4 (after the Pacific-midnight quota reset), Search Console, Brevo, Zernio, Neon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.growth_pull --tier daily
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
      - key: CONNECTORS_DRY_RUN
        fromService:
          type: web
          name: group-hq
          envVarKey: CONNECTORS_DRY_RUN
