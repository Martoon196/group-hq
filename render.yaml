services:
  - type: web
    name: group-hq
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    # No --proxy-headers / --forwarded-allow-ips: trusting X-Forwarded-For from any address would let a caller
    # choose the address the login throttle keys on. app.auth.client_ip reads the RIGHT-most X-Forwarded-For
    # entry, the one Render's proxy appended, and the throttle also has a per-account key that no address can
    # reset. Confirm against a staging deploy that Render appends rather than overwrites the header.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://group-hq.onrender.com
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      # Used once, at the first boot, to create the admin; the first login must change it. Clear it from the
      # dashboard after that boot so the working password never lives in the environment.
      - key: ADMIN_PASSWORD
        sync: false
      - key: PP_BASE_URL
        value: https://propertypredator.com
      - key: PP_SERVICE_TOKEN
        sync: false
      - key: ORDRIS_BASE_URL
        value: https://ordris.io
      - key: ORDRIS_PARTNER_TOKEN
        sync: false
      - key: KP_BASE_URL
        value: https://portal.keypropertiesuk.co.uk
      - key: KP_PARTNER_TOKEN
        sync: false
      - key: HNH_BASE_URL
        value: https://hellonewhome.co.uk
      - key: HNH_PARTNER_TOKEN
        sync: false
      # "1" keeps every product in dry run; "0" sends to every product; a list keeps only those products in
      # dry run. Ordris went live on 21 October 2026 (lookup answered ok with the shared token); the others stay
      # listed until their partner branches are deployed and their tokens set. Shipped as "1" before that;
      # (for example "ordris,kp,hnh" while PP goes live; HNH stays listed until the data sharing agreement
      # exists), so a product without a token never burns its retry attempts every night.
      - key: CONNECTORS_DRY_RUN
        value: "pp,kp,hnh"
      # Franchise follow-up emails. With SMTP_HOST unset the emails are shown for copying and nothing is sent.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      - key: MAIL_FROM
        sync: false
      # Bearer token Hello New Home presents to GET /api/territories.json (district, area, state only).
      - key: TERRITORY_EXPORT_TOKEN
        sync: false

  - type: cron
    name: group-hq-recompute
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "10 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.recompute
    # Product tokens are not copied here yet. Render can only copy a variable the web service actually holds,
    # and every token is blank until its product is switched on (CONNECTORS_DRY_RUN). When a product goes
    # live: set its token on the web service first, then add the matching fromService entry below and sync.
    # Until then the nightly job records that product's grants as not configured and sends nothing.
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
      - key: PP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: PP_BASE_URL
      - key: ORDRIS_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_BASE_URL
      - key: ORDRIS_PARTNER_TOKEN
        fromService:
          type: web
          name: group-hq
          envVarKey: ORDRIS_PARTNER_TOKEN
      - key: KP_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: KP_BASE_URL
      - key: HNH_BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: HNH_BASE_URL
      - key: CONNECTORS_DRY_RUN
        fromService:
          type: web
          name: group-hq
          envVarKey: CONNECTORS_DRY_RUN

  # Seller self-billing statements: on the 10th it generates the previous month for every seller with payable
  # entries; on any other day it is a no-op (app/jobs/statements.py). Runs after the recompute.
  - type: cron
    name: group-hq-statements
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "40 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.statements
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: group-hq
          envVarKey: SECRET_KEY
      - key: BASE_URL
        fromService:
          type: web
          name: group-hq
          envVarKey: BASE_URL
